# Supabase pausa los proyectos gratuitos tras 7 días sin actividad.
# Esta tarea hace una consulta diaria para que el proyecto no se pause.
# Requiere dos secretos en GitHub: Settings > Secrets and variables > Actions
#   SUPABASE_URL        (https://xxxx.supabase.co)
#   SUPABASE_ANON_KEY   (la clave anon / publishable)
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" -a -n "$SUPABASE_ANON_KEY" || { echo "Faltan los secretos"; exit 1; }
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/trips?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" > /dev/null
          echo "Supabase responde correctamente"

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# El enrutado usa "#/", así que no hacen falta redirecciones de SPA.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# El index y el manifest no se cachean para que las versiones nuevas lleguen enseguida.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
